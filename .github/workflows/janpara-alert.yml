name: Janpara Alert

on:
  schedule:
    # Runs every hour at :07 (UTC). Since it's hourly, the hour offset vs JST doesn't matter.
    - cron: "7 * * * *"
  workflow_dispatch: {}   # allow manual run from the Actions tab

permissions:
  contents: write         # needed so the workflow can commit the updated state file

concurrency:
  group: janpara-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gentle jitter to avoid top-of-hour traffic spikes
        run: |
          # sleep 0–240s randomly (up to 4 minutes)
          S=$((RANDOM % 241)); echo "Sleeping ${S}s..."; sleep $S

      - name: Run alert scripts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAILS: ${{ secrets.TO_EMAILS }}
        run: |
          mkdir -p state
          python -u janpara_alert.py
          python -u janpara_macbook_watcher.py
          python -u janpara_ipad_alert.py

      - name: Commit updated state (if changed)
        run: |
          if [ -n "$(git status --porcelain state/janpara_seen.json state/janpara_macbook_seen.json state/janpara_ipad_seen.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/janpara_seen.json state/janpara_macbook_seen.json state/janpara_ipad_seen.json
            git commit -m "Update janpara state [skip ci]" || true
            git push
          else
            echo "No state changes to commit."
          fi
