name: Janpara Alert (iPad)

on:
  schedule:
    # Runs every hour at :27 (UTC). Since it's hourly, the hour offset vs JST doesn't matter.
    - cron: "27 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: janpara-alert-ipad
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAILS: ${{ secrets.TO_EMAILS }}
        run: |
          mkdir -p state
          python -u janpara_ipad_alert.py

      - name: Commit updated state (if changed)
        run: |
          if [ -n "$(git status --porcelain state/janpara_ipad_seen.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/janpara_ipad_seen.json
            git commit -m "Update janpara state (ipad) [skip ci]" || true
            git push
          else
            echo "No state changes to commit."
          fi
